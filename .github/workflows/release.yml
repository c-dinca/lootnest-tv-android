name: Release
run-name: "Release"

# A push to master whose VERSION has no release yet makes that release (tag
# v<VERSION> on that commit) with the signed .apk and its SHA-256, which
# Lootnest on the PC pins (core.AndroidAppPinned).
#
# Signing needs two repository secrets, made once (see the README):
# LOOTNEST_KEYSTORE_B64 (the keystore, base64; its key's alias is
# "lootnest") and LOOTNEST_KEYSTORE_PASSWORD (the keystore's and the key's).
# The same key has to sign every release, or TVs refuse the update.
on:
  push:
    branches: [ master ]
    paths: [ VERSION ]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d '[:space:]' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "${{ github.repository }}" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-java@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: 21
      - name: Signing key
        if: steps.ver.outputs.skip != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.LOOTNEST_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::The signing secrets aren't set: see the README, Releases."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/lootnest-tv.keystore"
          echo "LOOTNEST_KEYSTORE=$RUNNER_TEMP/lootnest-tv.keystore" >> "$GITHUB_ENV"
      - name: Android NDK
        if: steps.ver.outputs.skip != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "platforms;android-37.0" > /dev/null
      - name: Build
        if: steps.ver.outputs.skip != 'true'
        env:
          LOOTNEST_KEYSTORE_PASSWORD: ${{ secrets.LOOTNEST_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleNonRootRelease
          mkdir -p dist
          cp app/build/outputs/apk/nonRoot/release/app-nonRoot-release.apk "dist/com.lootnest.tv_${{ steps.ver.outputs.version }}.apk"
          cd dist && sha256sum *.apk > SHA256SUMS && cat SHA256SUMS
      - uses: ncipollo/release-action@v1
        if: steps.ver.outputs.skip != 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.ver.outputs.version }}
          commit: ${{ github.sha }}
          name: Lootnest for TV v${{ steps.ver.outputs.version }}
          body: "Lootnest for TV for Android TV, Google TV and Fire TV. Lootnest on the PC installs it from Settings, TV, Add an Android TV. Based on Moonlight Android (GPL v3); the source is this repository at this tag."
          artifacts: dist/*.apk,dist/SHA256SUMS
